name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall glue_jobs
          python -m compileall streamlit_app
      
      - name: Validate JSON config files
        run: |
          python -m json.tool config_files/bronze_table_config.json > /dev/null
          python -m json.tool config_files/silver_table_config.json > /dev/null
          python -m json.tool config_files/gold_table_config.json > /dev/null
      
      - name: Install test dependencies
        run: |
          pip install pytest pandas pyspark delta-spark
      
      - name: Run unit tests
        run: |
          python -m pytest tests/
