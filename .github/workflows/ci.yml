name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall glue_jobs
          python -m compileall streamlit_app
      
      - name: Validate JSON config files
        run: |
          python -m json.tool config/bronze_table_config.json > /dev/null
          python -m json.tool config/silver_table_config.json > /dev/null
          python -m json.tool config/gold_table_config.json > /dev/null
